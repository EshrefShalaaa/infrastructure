services:
  angular:
    image: ghcr.io/eshrefshalaaa/angular-app:latest
    container_name: angular-container
    restart: always
    ports:
      - "4200:80"
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  react:
    image: ghcr.io/eshrefshalaaa/react-app:latest
    container_name: react-container
    restart: always
    ports:
      - "3000:80"
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - web

networks:
  web:
    external: true
    name: web-apps_web

volumes:
  npm_data:
  npm_letsencrypt: